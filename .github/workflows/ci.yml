name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      minimal: ${{ steps.filter.outputs.minimal }}
      light: ${{ steps.filter.outputs.light }}
      android_light: ${{ steps.filter.outputs.android_light }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'artboard-runtime/**'
              - 'artboard-codegen/**'
              - 'artboard-gradle-plugin/**'
              - 'artboard-viewer/**'
              - 'artboard-viewer-dist/**'
              - '.github/workflows/**'
            minimal:
              - 'samples/minimal/**'
            light:
              - 'samples/light/**'
            android_light:
              - 'samples/android-light/**'

  core:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core, compile runtime Wasm, and build prebuilt viewer
        run: >-
          ./gradlew --no-daemon --configuration-cache
          test :artboard-runtime:jvmTest :artboard-runtime:compileKotlinWasmJs
          :artboard-viewer-dist:jar

  minimal-consumer:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true' || needs.changes.outputs.minimal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source-free Wasm consumer contract and compile gallery
        run: >-
          ./gradlew -p samples/minimal --no-daemon --configuration-cache
          artboardDoctor artboardReport compileKotlinWasmJs

  light-consumer:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true' || needs.changes.outputs.light == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JVM snapshot consumer (no wasmJs target)
        run: >-
          ./gradlew -p samples/light --no-daemon --configuration-cache
          artboardDoctor artboardReport artboardSnapshot artboardExport

  android-light-consumer:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true' || needs.changes.outputs.android_light == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android-only snapshot consumer (no wasmJs / jvm target)
        run: >-
          ./gradlew -p samples/android-light --no-daemon --configuration-cache
          artboardDoctor artboardReport artboardSnapshot artboardExport
