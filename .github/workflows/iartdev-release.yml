name: iArtDev Release

on:
  push:
    tags:
      - 'iartdev-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifactGlob: iartdev-app/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            artifactGlob: iartdev-app/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        run: ./gradlew --no-daemon --configuration-cache :iartdev-app:${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: iartdev-${{ matrix.os }}
          path: ${{ matrix.artifactGlob }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
